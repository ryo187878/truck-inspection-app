<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>TRAMO スマホ入力検証</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f6f8;color:#222}
main{max-width:520px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px #0001}
h1{font-size:21px;margin:0 0 8px;color:#17365d}.note{font-size:13px;line-height:1.6;color:#667;margin-bottom:22px}
label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}input{width:100%;font-size:18px;border:1px solid #ccd2d8;border-radius:12px;padding:14px;background:#fff}
button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:#17365d;color:#fff}
.result{margin-top:16px;padding:14px;border-radius:12px;background:#eef5ff;min-height:52px}.small{font-size:12px;color:#667;margin-top:12px}
</style>
</head>
<body>
<main><div class="card">
<h1>TRAMO コンテナ番号入力テスト</h1>
<div class="note">Firebaseには接続しない検証専用ページです。入力中に文字を書き換えず、保存ボタンを押した時だけ本体と同じ正規化を行います。</div>
<label for="containerFormContainerNumber">コンテナ番号</label>
<input id="containerFormContainerNumber" type="text" placeholder="例：ABCD1234567" inputmode="latin" autocapitalize="characters" autocomplete="off" spellcheck="false">
<button type="button" id="saveTest">保存テスト</button>
<div class="result" id="result">ここに保存時の結果が表示されます。</div>
<div class="small">確認: 1文字ずつ入力できる / 勝手に連続しない / 削除できる / 保存後に英大文字と数字だけになる</div>
</div></main>
<script>
function containerNormalizeContainerNumber(v){
  return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}
document.getElementById("saveTest").addEventListener("click",()=>{
  const input=document.getElementById("containerFormContainerNumber");
  const normalized=containerNormalizeContainerNumber(input.value);
  document.getElementById("result").textContent=normalized ? "保存結果: "+normalized : "英数字を入力してください。";
});
</script>
</body></html>
