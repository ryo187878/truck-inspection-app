<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRAMO メニュー確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 40px}.brand{font-size:28px;font-weight:900;color:#17365d}.note{margin:6px 0 20px;color:#687080;font-size:13px}.main{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.main button{border:0;border-radius:14px;padding:17px 5px;font-size:15px;font-weight:850;background:#e5eaf0;color:#17365d;box-shadow:0 1px 4px #0002}.main button.active{background:#17365d;color:white}.sub{display:none;gap:7px;margin-top:10px}.sub.active{display:flex}.sub button{flex:1;border:1px solid #d2d9e2;border-radius:11px;background:white;min-height:52px;padding:8px 5px;font-weight:800;color:#26384d}.card{margin-top:18px;background:white;border-radius:18px;padding:22px 18px;box-shadow:0 2px 12px #0000000d}.card h2{margin:0 0 8px;font-size:21px;color:#17365d}.card p{margin:0;color:#687080;line-height:1.7}.screen{margin-top:14px;border:1px dashed #c8d0da;border-radius:12px;padding:20px;text-align:center;font-weight:800;color:#526273;background:#fafbfc}@media(max-width:390px){.main button{font-size:14px;padding:15px 3px}.sub button{font-size:13px}.brand{font-size:26px}}
</style></head><body><div class="wrap"><div class="brand">TRAMO</div><div class="note">メニュー構成・文字・スマホ表示の確認専用ページです。Firebaseには接続しません。</div><div class="main"><button class="active" onclick="group('inspection',this)">🛠 日常点検</button><button onclick="group('dispatch',this)">🚚 配車版</button><button onclick="group('admin',this)">⚙️ 管理</button></div><div id="inspection" class="sub active"><button onclick="screen('① 点検入力')">① 点検入力</button><button onclick="screen('② 点検履歴')">② 点検履歴</button><button onclick="screen('③ 点検履歴（保存版）')">③ 点検履歴<br>（保存版）</button></div><div id="dispatch" class="sub"><button onclick="screen('① 先行配車表')">① 先行配車表</button><button onclick="screen('② 海上コンテナ配車')">② 海上コンテナ配車</button><button onclick="screen('③ コンテナ履歴・追跡')">③ コンテナ<br>履歴・追跡</button></div><div id="admin" class="sub"><button onclick="screen('管理画面')">管理画面</button></div><div class="card"><h2 id="title">日常点検</h2><p id="desc">日常点検の機能を①〜③にまとめた表示です。</p><div class="screen" id="screen">①〜③をタップして表示を確認できます</div></div></div><script>
function group(g,b){document.querySelectorAll('.main button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.sub').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(g).classList.add('active');const m={inspection:['日常点検','日常点検の機能を①〜③にまとめた表示です。'],dispatch:['配車版','配車関連の機能を①〜③にまとめた表示です。'],admin:['管理','管理機能を通常の操作導線から分けた表示です。']}[g];title.textContent=m[0];desc.textContent=m[1];screenEl().textContent='各ボタンをタップして表示を確認できます'}function screen(t){screenEl().textContent=t+' を選択しました'}function screenEl(){return document.getElementById('screen')}
</script></body></html>
