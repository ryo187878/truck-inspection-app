name: TRAMO master delete verification
on:
  push:
    branches: [test-master-admin-delete-button]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Yamato daily tests
        run: node tools/yamato-daily.test.cjs
      - name: Full release regression
        run: node --test tools/verify-release.test.cjs
      - name: Firestore Rules tests
        run: npx firebase-tools emulators:exec --only firestore "node --test rules-tests/firestore.rules.test.js"
