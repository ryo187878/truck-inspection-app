name: Vaccine 2 Verify

on:
  push:
    branches:
      - ai-factory/vaccine2-fixed-qr-contract-20261006

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Release regression tests
        run: node --test tools/verify-release.test.cjs
      - name: Firestore Rules emulator tests
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project truck-inspection-app-rules-tests "node --test --test-name-pattern='48\\.' rules-tests/firestore.rules.test.js"
      - name: Show Firestore rule diagnostics
        if: failure()
        run: |
          echo "=== Firestore debug diagnostics ==="
          tail -n 500 firestore-debug.log || true
