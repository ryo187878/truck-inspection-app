name: Vaccine 6 external proof
on:
  push:
    branches:
      - ai-factory/vaccine6-axis-generation-external-20261006

jobs:
  external-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI FACTORY branch
        uses: actions/checkout@v4
        with:
          path: ai-factory

      - name: Checkout external inventory app at pinned commit
        uses: actions/checkout@v4
        with:
          repository: TheCandyLoop/inventory-management-crud
          ref: 54a500b6e288dddc3fa4223f1dc9e75b96132d18
          path: external/inventory

      - name: Checkout external booking app at pinned commit
        uses: actions/checkout@v4
        with:
          repository: rizbud/express-sqlite-booking-system
          ref: 02edad46d1d59a9d95b64722a88e00b1ffe5c408
          path: external/booking

      - name: Generate inventory candidate axes
        working-directory: ai-factory
        run: |
          node tools/ai-factory-generate-axis.cjs ../external/inventory --json | tee /tmp/inventory-axis.json
          node -e "const x=require('/tmp/inventory-axis.json'); const c=x.candidates.find(v=>v.axisId==='boundary.server-domain-enforcement'); if(!c||!c.meta.pass) process.exit(1);"

      - name: Generate booking candidate axes
        working-directory: ai-factory
        run: |
          node tools/ai-factory-generate-axis.cjs ../external/booking --json | tee /tmp/booking-axis.json
          node -e "const x=require('/tmp/booking-axis.json'); const c=x.candidates.find(v=>v.axisId==='resource.consumption-sign-invariant'); if(!c||!c.meta.pass) process.exit(1);"

      - name: Start inventory app unchanged
        working-directory: external/inventory
        run: |
          npm install
          nohup npm start >/tmp/inventory.log 2>&1 &
          echo $! >/tmp/inventory.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/products >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/inventory.log
          exit 1

      - name: Probe inventory generated axis
        working-directory: ai-factory
        run: |
          node tools/ai-factory-external-probe.cjs inventory http://127.0.0.1:3000 | tee /tmp/inventory-probe.json
          node -e "const x=require('/tmp/inventory-probe.json'); if(x.axisId!=='boundary.server-domain-enforcement'||x.outcome!=='detected'||!x.observation.persistedNegative) process.exit(1);"

      - name: Stop inventory app
        if: always()
        run: |
          if [ -f /tmp/inventory.pid ]; then kill $(cat /tmp/inventory.pid) || true; fi

      - name: Build and start booking app unchanged
        working-directory: external/booking
        run: |
          npm ci
          npm run build
          APP_PORT=3001 nohup node dist/index.js >/tmp/booking.log 2>&1 &
          echo $! >/tmp/booking.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/booking.log
          exit 1

      - name: Probe booking generated axis
        working-directory: ai-factory
        run: |
          node tools/ai-factory-external-probe.cjs booking http://127.0.0.1:3001 | tee /tmp/booking-probe.json
          node -e "const x=require('/tmp/booking-probe.json'); if(x.axisId!=='resource.consumption-sign-invariant'||x.outcome!=='detected'||!x.observation.increased) process.exit(1);"

      - name: Stop booking app
        if: always()
        run: |
          if [ -f /tmp/booking.pid ]; then kill $(cat /tmp/booking.pid) || true; fi
