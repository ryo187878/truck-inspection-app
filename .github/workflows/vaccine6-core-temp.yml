name: Vaccine 6 core validation
on:
  push:
    branches:
      - ai-factory/vaccine6-axis-generation-external-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: G71-G80 candidate-generation antibody
        run: node --test tools/ai-factory-generate-axis.test.cjs
      - name: Prior selector regression
        run: node --test tools/ai-factory-select-tests.test.cjs tools/ai-factory-score-axes.test.cjs
      - name: Full TRAMO regression
        run: node --test tools/*.test.cjs
      - name: Promotion Gate
        run: node tools/promotion-gate.cjs
