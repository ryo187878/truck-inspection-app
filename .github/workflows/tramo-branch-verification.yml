name: TRAMO branch verification
on:
  push:
    branches: [test-yamato-daily-3-shipper-sort]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Yamato daily tests
        run: node tools/yamato-daily.test.cjs
      - name: Existing release regression
        run: node --test tools/verify-release.test.cjs
      - name: Firestore Rules tests
        run: npx firebase-tools emulators:exec --only firestore "node --test rules-tests/firestore.rules.test.js"
