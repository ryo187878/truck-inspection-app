name: Promotion Gate temporary validation
on:
  push:
    branches:
      - ai-factory/vaccine2-promotion-gate-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promotion Gate antibody tests
        run: node --test tools/promotion-gate.test.cjs
      - name: Current repository must be stopped by gate
        shell: bash
        run: |
          set +e
          node tools/promotion-gate.cjs
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected Promotion Gate STOP(exit 2), got exit $code"
            exit 1
          fi
