name: Promotion Gate temporary validation
on:
  push:
    branches:
      - ai-factory/vaccine2-promotion-gate-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promotion Gate antibody tests
        run: node --test tools/promotion-gate.test.cjs
      - name: Current repository must pass Promotion Gate
        run: node tools/promotion-gate.cjs
