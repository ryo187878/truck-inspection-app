name: Vaccine 5 effectiveness validation
on:
  push:
    branches:
      - ai-factory/vaccine5-axis-effectiveness-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence scoring antibody tests
        run: node --test tools/ai-factory-score-axes.test.cjs
      - name: Show real axis ranking
        run: node tools/ai-factory-score-axes.cjs
      - name: Selector regression
        run: node --test tools/ai-factory-select-tests.test.cjs
      - name: Full TRAMO regression
        run: node --test tools/*.test.cjs
      - name: Promotion Gate
        run: node tools/promotion-gate.cjs
