name: Vaccine 4 targeted validation
on:
  push:
    branches:
      - ai-factory/vaccine4-impact-test-selector-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Selector antibody tests
        run: node --test tools/ai-factory-select-tests.test.cjs
      - name: Auth impact targeted run
        run: node tools/ai-factory-select-tests.cjs --changed auth-context.js --run
      - name: Branch normalization targeted run
        run: node tools/ai-factory-select-tests.cjs --failure "枝番 normalization failed" --run
      - name: Tenant isolation targeted run
        run: node tools/ai-factory-select-tests.cjs --failure "他社 tenant isolation failure" --run
      - name: Safe fallback targeted run
        run: node tools/ai-factory-select-tests.cjs --changed unknown/new-feature.txt --run
      - name: Full TRAMO regression
        run: node --test tools/*.test.cjs
      - name: Promotion Gate
        run: node tools/promotion-gate.cjs
